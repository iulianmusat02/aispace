<title>Registru echipă</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #faf9f5;
    --bg-secondary: #f5f4ef;
    --bg-card: #ffffff;
    --bg-card-hover: #fdfcf9;
    --text-primary: #141413;
    --text-secondary: #5c5c5a;
    --text-muted: #8c8c8a;
    --border: #e5e4df;
    --border-light: #eeeee9;
    --accent: #d97757;
    --accent-hover: #c4684a;
    --accent-soft: #f3ddd2;
    --skill-hard: #d97757;
    --skill-soft: #6b8f82;
    --skill-involve: #c9971f;
    --danger: #ad4a3a;
    --danger-soft: #f5ddd8;
    --info: #5b7a99;
    --info-soft: #dde6ed;
    --shadow: rgba(20, 20, 19, 0.05);
    --shadow-hover: rgba(20, 20, 19, 0.09);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-primary: #201f1c;
      --bg-secondary: #262520;
      --bg-card: #2b2a25;
      --bg-card-hover: #302f29;
      --text-primary: #f3f1ea;
      --text-secondary: #b6b3aa;
      --text-muted: #85827a;
      --border: #3d3b34;
      --border-light: #332f2a;
      --accent: #e08a68;
      --accent-hover: #e79c7e;
      --accent-soft: #4a382f;
      --skill-hard: #e08a68;
      --skill-soft: #8fb3a6;
      --skill-involve: #ddb44f;
      --danger: #d9776a;
      --danger-soft: #4a2f2a;
      --info: #8fb0cc;
      --info-soft: #2b3844;
      --shadow: rgba(0, 0, 0, 0.25);
      --shadow-hover: rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg-primary: #201f1c;
    --bg-secondary: #262520;
    --bg-card: #2b2a25;
    --bg-card-hover: #302f29;
    --text-primary: #f3f1ea;
    --text-secondary: #b6b3aa;
    --text-muted: #85827a;
    --border: #3d3b34;
    --border-light: #332f2a;
    --accent: #e08a68;
    --accent-hover: #e79c7e;
    --accent-soft: #4a382f;
    --skill-hard: #e08a68;
    --skill-soft: #8fb3a6;
    --skill-involve: #ddb44f;
    --danger: #d9776a;
    --danger-soft: #4a2f2a;
    --info: #8fb0cc;
    --info-soft: #2b3844;
    --shadow: rgba(0, 0, 0, 0.25);
    --shadow-hover: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    padding: 32px 20px 64px;
  }

  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .page {
    max-width: 760px;
    margin: 0 auto;
  }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 6px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 0.88rem;
    margin: 4px 0 0;
  }

  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }

  .legend i {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    display: inline-block;
  }

  .dot-hard { background: var(--skill-hard); }
  .dot-soft { background: var(--skill-soft); }
  .dot-involve { background: var(--skill-involve); }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin: 22px 0 18px;
    padding: 10px 12px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1 1 160px;
    min-width: 140px;
  }

  .search-wrap svg {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
  }

  #search {
    width: 100%;
    padding: 7px 10px 7px 30px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.85rem;
  }

  #search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .sort-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .sort-btn {
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .sort-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }

  .sort-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .sort-btn .arrow { font-size: 0.65rem; margin-left: 2px; }

  .list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 12px;
    box-shadow: 0 1px 2px var(--shadow);
    overflow: hidden;
    transition: box-shadow 0.2s, border-color 0.2s;
  }

  .card:hover { box-shadow: 0 4px 14px var(--shadow-hover); }

  .card-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }

  .card-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 0.85rem;
    color: #fff;
    flex-shrink: 0;
  }

  .id-block { min-width: 140px; flex-shrink: 0; }

  .name-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

  .name { font-weight: 600; font-size: 0.95rem; }

  .role { font-size: 0.76rem; color: var(--text-muted); margin-top: 1px; }

  .badge {
    font-size: 0.65rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .badge-risk { background: var(--danger-soft); color: var(--danger); }
  .badge-watch { background: var(--info-soft); color: var(--info); }

  .bars {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.68rem;
    color: var(--text-muted);
  }

  .bar-label { width: 30px; flex-shrink: 0; }

  .bar-track {
    flex: 1;
    height: 6px;
    background: var(--bg-secondary);
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .fill-hard { background: var(--skill-hard); }
  .fill-soft { background: var(--skill-soft); }
  .fill-involve { background: var(--skill-involve); }

  .bar-val { width: 24px; text-align: right; flex-shrink: 0; }

  .chevron {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--text-muted);
    transition: transform 0.25s;
  }

  .card.open .chevron { transform: rotate(180deg); }

  .card-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }

  .card.open .card-body { max-height: 600px; }

  .card-body-inner {
    padding: 4px 16px 18px 66px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    border-top: 1px solid var(--border-light);
    padding-top: 14px;
  }

  .detail-block h4 {
    margin: 0 0 5px;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    font-weight: 600;
  }

  .detail-block p, .detail-block li {
    margin: 0;
    font-size: 0.85rem;
    color: var(--text-secondary);
    line-height: 1.55;
  }

  .detail-block ul { padding-left: 18px; margin: 0; display: flex; flex-direction: column; gap: 3px; }

  .detail-block.empty p { color: var(--text-muted); font-style: italic; }

  .note-1on1 {
    background: var(--bg-secondary);
    border-radius: 8px;
    padding: 10px 12px;
    border: 1px solid var(--border-light);
  }

  .note-1on1 .date { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 3px; display: block; }

  footer {
    margin-top: 28px;
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  .empty-state {
    text-align: center;
    padding: 40px 0;
    color: var(--text-muted);
    font-size: 0.85rem;
    display: none;
  }

  @media (max-width: 560px) {
    .card-head { flex-wrap: wrap; }
    .id-block { width: 100%; }
    .bars { width: 100%; }
    .card-body-inner { padding-left: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bar-fill, .card-body, .chevron { transition: none; }
  }
</style>

<div class="page">
  <header class="top">
    <div>
      <h1>Registru echipă</h1>
      <p class="subtitle">Scoruri 1:1 · scală 1&ndash;5 · actualizat 21.08.2026</p>
    </div>
    <div class="legend">
      <span><i class="dot-hard"></i>Competențe tehnice</span>
      <span><i class="dot-soft"></i>Competențe soft</span>
      <span><i class="dot-involve"></i>Implicare</span>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Caută nume…" autocomplete="off">
    </div>
    <div class="sort-group" id="sortGroup">
      <button class="sort-btn" data-sort="name">Nume</button>
      <button class="sort-btn" data-sort="hard">Competențe tehnice</button>
      <button class="sort-btn" data-sort="soft">Competențe soft</button>
      <button class="sort-btn" data-sort="involve">Implicare</button>
      <button class="sort-btn" data-sort="attention">Necesită atenție</button>
    </div>
  </div>

  <div class="list" id="list"></div>
  <p class="empty-state" id="emptyState">Niciun rezultat.</p>

  <footer>Click pe un card pentru detalii · 8 rapoarte directe</footer>
</div>

<script>
  const people = [
    {
      name: "Iulian Tandara", role: "Digital Developer",
      hard: 3, soft: 2.5, involve: 3,
      context: ["Implicat în discuția despre reorganizarea TPM (Customer Workflow BackOffice → Broker/Advisor Onboarding), alături de Geo. Subiect on hold.", "Nemulțumiri punctuale pe local sandbox — upgrade-uri dese la release candidates dau bătăi de cap."],
      lastOneOnOne: { date: "21.08.2026", text: "Discutat arii de aprofundat pentru dezvoltarea lui. Per total mulțumit de interacțiune; singurul minus e legat de sandbox local (upgrade-uri frecvente la RC-uri)." },
      goals: ["Aprofundare platformă: Product Factory, Offer Bundles, DEX + AI", "Familiarizare cu Third Party Management (TPM)", "GitHub — branching strategies", "Setup learning path (discuții + KT periodic) — scop: mai mult ownership / step-up"],
      badges: []
    },
    {
      name: "Cristian Marinescu", role: "Digital Developer · “Cristi”",
      hard: 3, soft: 2, involve: 2.5,
      context: ["Încă nu știe să facă workflow engine-ul (FintechOS) cap-coadă, în tranziția COS/DAO de la form driven flow la workflow engine. Necesită assist."],
      lastOneOnOne: null,
      goals: [],
      badges: []
    },
    {
      name: "Oana Tomescu", role: "Digital Developer",
      hard: 2.5, soft: 3.5, involve: 3,
      context: ["Discuție cu Alexandra Stoiean (HR) pentru salary raise."],
      lastOneOnOne: null,
      goals: [],
      badges: []
    },
    {
      name: "Georgiana Chiar", role: "Digital Developer · “Geo”",
      hard: 3, soft: 2.5, involve: 3,
      context: ["Implicată în discuția despre reorganizarea TPM (Customer Workflow BackOffice → Broker/Advisor Onboarding), alături de Iulian Tandara. Subiect on hold."],
      lastOneOnOne: { date: "14.08.2026", text: "Nu simte că avansează din punct de vedere tehnic, simte că rămâne în urmă pe hard-skills. Vrea step-up în carieră spre Solution Architect / Cyber Security. A aplicat deja la alte joburi." },
      goals: ["Plan de creștere tehnică / hard-skills, ca să nu rămână în urmă.", "Explorat traseu de carieră spre Solution Architect sau Cyber Security."],
      badges: [{ type: "risk", label: "Risc de plecare" }]
    },
    {
      name: "Ionuț Dima", role: "Principal Engineer",
      hard: 3, soft: 2.5, involve: 3.5,
      context: [],
      lastOneOnOne: null,
      goals: [],
      badges: []
    },
    {
      name: "Elena Man", role: "Solution Architect",
      hard: 4, soft: 3.5, involve: 4,
      context: ["Ownership țintă pentru “vault pipes” — git action care deployează secret keys în Vault Hashicorp de pe local pe shared dev.", "Ownership nou pe Data Core self service."],
      lastOneOnOne: { date: "21.08.2026", text: "Load e OK, nu se simte încărcată. Stare de spirit nu foarte bună, dar nu ține de muncă — are niște probleme în familie. De ținut minte să fiu atent/grijuliu la asta în perioada următoare." },
      goals: ["Step-up spre leadership: de implicat-o mai des în discuții (nu doar execuție), ca să capete contextul necesar."],
      badges: [{ type: "watch", label: "De urmărit" }]
    },
    {
      name: "Liviu Semacovschi", role: "Solution Architect",
      hard: 2.5, soft: 3.5, involve: 2.5,
      context: ["COS/DAO: se ocupă de back-office (App Data Form + Business Workflow).", "Finastra: WIP — blocat pe whitelistare IP + API impersonation, așteaptă update de la echipa lui Andrei Tudorica."],
      lastOneOnOne: null,
      goals: [],
      badges: []
    },
    {
      name: "Antonia Cotofana", role: "“Anto”",
      hard: 3, soft: 3, involve: 3,
      context: ["Încă nu știe să facă workflow engine-ul (FintechOS) cap-coadă, în tranziția COS/DAO de la form driven flow la workflow engine. Necesită assist."],
      lastOneOnOne: null,
      goals: [],
      badges: []
    }
  ];

  const AVATAR_COLORS = ["#d97757", "#6b8f82", "#c9971f", "#5b7a99", "#8a6bb0", "#b0556b"];

  function initials(name) {
    return name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
  }

  function avgAttention(p) {
    return Math.min(p.hard, p.soft, p.involve);
  }

  function badgeHTML(b) {
    const cls = b.type === "risk" ? "badge-risk" : "badge-watch";
    return `<span class="badge ${cls}">${b.label}</span>`;
  }

  function detailBlock(title, bodyHTML, isEmpty) {
    return `<div class="detail-block ${isEmpty ? "empty" : ""}">
      <h4>${title}</h4>
      ${bodyHTML}
    </div>`;
  }

  function renderCard(p, idx) {
    const color = AVATAR_COLORS[idx % AVATAR_COLORS.length];
    const contextHTML = p.context.length
      ? `<ul>${p.context.map(c => `<li>${c}</li>`).join("")}</ul>`
      : `<p>Fără context activ notat.</p>`;
    const goalsHTML = p.goals.length
      ? `<ul>${p.goals.map(g => `<li>${g}</li>`).join("")}</ul>`
      : `<p>Fără obiective notate.</p>`;
    const oneOnOneHTML = p.lastOneOnOne
      ? `<div class="note-1on1"><span class="date mono">${p.lastOneOnOne.date}</span><p>${p.lastOneOnOne.text}</p></div>`
      : `<p>Niciun 1:1 notat încă.</p>`;

    return `
    <div class="card" data-name="${p.name.toLowerCase()}" data-hard="${p.hard}" data-soft="${p.soft}" data-involve="${p.involve}" data-attention="${avgAttention(p)}">
      <div class="card-head" role="button" tabindex="0" aria-expanded="false">
        <div class="avatar" style="background:${color}">${initials(p.name)}</div>
        <div class="id-block">
          <div class="name-row">
            <span class="name">${p.name}</span>
            ${p.badges.map(badgeHTML).join("")}
          </div>
          <div class="role">${p.role}</div>
        </div>
        <div class="bars">
          <div class="bar-row">
            <span class="bar-label">Tehn.</span>
            <span class="bar-track"><span class="bar-fill fill-hard" data-target="${(p.hard / 5) * 100}"></span></span>
            <span class="bar-val mono">${p.hard.toFixed(1)}</span>
          </div>
          <div class="bar-row">
            <span class="bar-label">Soft</span>
            <span class="bar-track"><span class="bar-fill fill-soft" data-target="${(p.soft / 5) * 100}"></span></span>
            <span class="bar-val mono">${p.soft.toFixed(1)}</span>
          </div>
          <div class="bar-row">
            <span class="bar-label">Impl.</span>
            <span class="bar-track"><span class="bar-fill fill-involve" data-target="${(p.involve / 5) * 100}"></span></span>
            <span class="bar-val mono">${p.involve.toFixed(1)}</span>
          </div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="card-body">
        <div class="card-body-inner">
          ${detailBlock("Context activ", contextHTML, !p.context.length)}
          ${detailBlock("Ultimul 1:1", oneOnOneHTML, !p.lastOneOnOne)}
          ${detailBlock("Obiective", goalsHTML, !p.goals.length)}
        </div>
      </div>
    </div>`;
  }

  const list = document.getElementById("list");
  list.innerHTML = people.map(renderCard).join("");

  function animateBars(scope) {
    scope.querySelectorAll(".bar-fill").forEach(el => {
      const target = el.getAttribute("data-target");
      el.style.width = "0%";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        el.style.width = target + "%";
      }));
    });
  }
  animateBars(list);

  list.addEventListener("click", e => {
    const head = e.target.closest(".card-head");
    if (!head) return;
    const card = head.closest(".card");
    const isOpen = card.classList.toggle("open");
    head.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });

  list.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const head = e.target.closest(".card-head");
    if (!head) return;
    e.preventDefault();
    head.click();
  });

  const searchInput = document.getElementById("search");
  const emptyState = document.getElementById("emptyState");

  function applyFilter() {
    const q = searchInput.value.trim().toLowerCase();
    let visibleCount = 0;
    list.querySelectorAll(".card").forEach(card => {
      const match = card.dataset.name.includes(q);
      card.style.display = match ? "" : "none";
      if (match) visibleCount++;
    });
    emptyState.style.display = visibleCount === 0 ? "block" : "none";
  }
  searchInput.addEventListener("input", applyFilter);

  const sortGroup = document.getElementById("sortGroup");
  let currentSort = null;
  let currentDir = 1;

  sortGroup.addEventListener("click", e => {
    const btn = e.target.closest(".sort-btn");
    if (!btn) return;
    const key = btn.dataset.sort;

    if (currentSort === key) {
      currentDir *= -1;
    } else {
      currentSort = key;
      currentDir = key === "name" ? 1 : -1;
    }

    sortGroup.querySelectorAll(".sort-btn").forEach(b => {
      b.classList.remove("active");
      b.querySelector(".arrow")?.remove();
    });
    btn.classList.add("active");
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = currentDir === 1 ? "↑" : "↓";
    btn.appendChild(arrow);

    const cards = Array.from(list.querySelectorAll(".card"));
    cards.sort((a, b) => {
      let av, bv;
      if (key === "name") {
        av = a.dataset.name; bv = b.dataset.name;
        return currentDir * av.localeCompare(bv);
      }
      av = parseFloat(a.dataset[key]);
      bv = parseFloat(b.dataset[key]);
      return currentDir * (av - bv);
    });
    cards.forEach(c => list.appendChild(c));
  });
</script>
